<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded square background with gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)"/>

  <!-- Subtle inner glow ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Car body icon (centered, scaled to fit) -->
  <!-- Windshield / roof arc -->
  <path
    d="M18 34 L22 24 Q24 20 28 20 L36 20 Q40 20 42 24 L46 34"
    stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"
  />
  <!-- Car body chassis -->
  <path
    d="M14 34 L14 40 Q14 42 16 42 L48 42 Q50 42 50 40 L50 34 Z"
    fill="rgba(255,255,255,0.9)"
  />
  <!-- Windshield fill -->
  <path
    d="M21 34 L24.5 25.5 Q26 22 29 22 L35 22 Q38 22 39.5 25.5 L43 34 Z"
    fill="rgba(255,255,255,0.22)"
  />
  <!-- Left wheel -->
  <circle cx="22" cy="43" r="5.5" fill="url(#bg-grad)"/>
  <circle cx="22" cy="43" r="3" fill="white" opacity="0.85"/>
  <circle cx="22" cy="43" r="1.2" fill="url(#bg-grad)"/>
  <!-- Right wheel -->
  <circle cx="42" cy="43" r="5.5" fill="url(#bg-grad)"/>
  <circle cx="42" cy="43" r="3" fill="white" opacity="0.85"/>
  <circle cx="42" cy="43" r="1.2" fill="url(#bg-grad)"/>
  <!-- Headlight left -->
  <rect x="14" y="35" width="5" height="3" rx="1.5" fill="#FFD580" opacity="0.95"/>
  <!-- Headlight right -->
  <rect x="45" y="35" width="5" height="3" rx="1.5" fill="#FFD580" opacity="0.95"/>
  <!-- Door line detail -->
  <line x1="32" y1="34" x2="32" y2="41" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4612E"/>
      <stop offset="100%" stop-color="#B84A20"/>
    </linearGradient>
  </defs>
</svg>